name: kairos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
    ports:
      - "${KAIROS_PG_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-mlflow-db.sh:/docker-entrypoint-initdb.d/init-mlflow-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairos} -d ${POSTGRES_DB:-kairos}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mlflow:
    build: ./mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-kairos}:${POSTGRES_PASSWORD:-kairos}@postgres:5432/mlflow
      --default-artifact-root /mlartifacts
      --serve-artifacts
    ports:
      - "${KAIROS_MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlartifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairos}
      POSTGRES_DB: ${POSTGRES_DB:-kairos}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "${KAIROS_API_PORT:-8010}:8000"
    volumes:
      - ./backend:/app       # hot reload; uvicorn --reload watches the bind mount
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  web:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "${KAIROS_WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # keep the image's node_modules, not the host's
    depends_on:
      - api

volumes:
  pgdata:
  mlartifacts:
